{% load static %}

<!DOCTYPE html>

<html>

<head>


<title>Add Client</title>

<link
    rel="stylesheet"
    href="{% static 'dashboard/dashboard.css' %}"
>

</head>

<body>

<div class="layout">


{% include 'dashboard/includes/sidebar.html' %}

<main class="main">

    <div class="page-header">

        <div>
            <span class="eyebrow">CLIENTS</span>
            <h1>Add Client</h1>
            <p>Create a new client profile.</p>
        </div>

    </div>


    <div class="card">

        <div class="section-header">

            <div>
                <span class="eyebrow">PROFILE</span>
                <h2>Client Information</h2>
            </div>

        </div>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">

                <button type="submit" class="add-button">
                    Add Client
                </button>

                <a
                    href="/patients/"
                    class="view-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</div>

</body>

</html>
