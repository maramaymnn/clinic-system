{% load static %}

<!DOCTYPE html>

<html>

<head>

<title>Client Intake</title>

<link
    rel="stylesheet"
    href="{% static 'dashboard/dashboard.css' %}"
>

</head>

<body>

<div class="layout">


{% include 'dashboard/includes/sidebar.html' %}

<main class="main">

    <div class="page-header">

        <div>
            <span class="eyebrow">CLIENT PROFILE</span>
            <h1>Client Intake</h1>
            <p>
                Initial assessment for
                <strong>{{ patient.name }}</strong>
            </p>
        </div>

    </div>


    <div class="card">

        <div class="section-header">

            <div>
                <span class="eyebrow">ASSESSMENT</span>
                <h2>Client Information</h2>
            </div>

        </div>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">

                <button type="submit" class="add-button">
                    Save Intake
                </button>

                <a
                    href="/patients/{{ patient.id }}/"
                    class="view-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</div>

</body>

</html>
